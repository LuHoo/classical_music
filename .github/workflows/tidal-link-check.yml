name: Tidal link check

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum unique collection URLs (1-50; report only)"
        required: true
        default: "5"
        type: string
      run_round:
        description: "Run one scheduled maintenance round (20 least recently checked URLs)"
        required: false
        default: "false"
        type: boolean
  # Hourly production rotation. GitHub only schedules workflows from the
  # default branch, so this activates after the issue-64 PR merges to main.
  schedule:
    - cron: "0 * * * *"
  # Bootstrap the live pilot before this draft is merged. This trigger only
  # covers the dedicated issue-64 branch and maintenance-specific edits.
  push:
    branches: [issue-64-tidal-link-maintenance]
    paths:
      - .github/workflows/tidal-link-check.yml
      - scripts/check_tidal_links.py
      - scripts/escalate_tidal_failures.py
      - src/classical_music/tidal_auth.py
      - src/classical_music/tidal_maintenance.py

permissions:
  contents: read

concurrency:
  group: tidal-link-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.run_round == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Authenticated report-only pilot
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
          PILOT_LIMIT: ${{ inputs.limit || '5' }}
        run: python scripts/run_tidal_api_check.py --limit "$PILOT_LIMIT"
      - name: Playlist ISRC recovery pilot (read only)
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
        run: python scripts/playlist_recovery_pilot.py
      - name: Stable live playlist and occurrence pilot
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
          TIDAL_USER_ACCESS_TOKEN: ${{ secrets.TIDAL_USER_ACCESS_TOKEN }}
        run: |
          if [ -n "$TIDAL_USER_ACCESS_TOKEN" ]; then
            python scripts/playlist_live_pilot.py --test-write
          else
            python scripts/playlist_live_pilot.py
          fi
      - name: Add report summary
        if: always()
        run: |
          if [ -f reports/tidal-maintenance/latest.md ]; then
            cat reports/tidal-maintenance/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No maintenance report produced; see the authenticated pilot step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload operational report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tidal-link-check-${{ github.run_id }}
          path: |
            reports/tidal-maintenance/playlist-live-pilot.json
            reports/tidal-maintenance/playlist-recovery.json
            reports/tidal-maintenance/latest.json
            reports/tidal-maintenance/latest.md
          if-no-files-found: ignore
          retention-days: 14

  round:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_round == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Restore maintenance rotation state
        uses: actions/cache/restore@v6
        with:
          path: |
            reports/tidal-maintenance/state.json
            reports/tidal-maintenance/latest.json
          key: tidal-maintenance-state-v1
          restore-keys: |
            tidal-maintenance-state-v1
      - name: Check 20 least recently checked Tidal URLs
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
        run: |
          python scripts/check_tidal_links.py --use-api --country NL \
            --state reports/tidal-maintenance/state.json --limit 20
      - name: Escalate problematic URLs to GitHub issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/escalate_tidal_failures.py
      - name: Add round summary
        if: always()
        run: |
          if [ -f reports/tidal-maintenance/latest.md ]; then
            cat reports/tidal-maintenance/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No maintenance report produced; see the round step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save maintenance rotation state
        uses: actions/cache/save@v6
        with:
          path: |
            reports/tidal-maintenance/state.json
            reports/tidal-maintenance/latest.json
          key: tidal-maintenance-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload round report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tidal-link-round-${{ github.run_id }}
          path: |
            reports/tidal-maintenance/state.json
            reports/tidal-maintenance/latest.json
            reports/tidal-maintenance/latest.md
          if-no-files-found: ignore
          retention-days: 14
