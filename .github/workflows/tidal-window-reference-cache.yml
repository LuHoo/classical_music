name: Best Classical canonical reference cache
on:
  push:
    branches: [tidal-window-reference-cache]
    paths: [.github/workflows/tidal-window-reference-cache.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Read canonical track references in batches of twenty
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
        run: python scripts/cache_tidal_window_references.py
      - uses: actions/upload-artifact@v7
        with:
          name: reference-cache-${{ github.run_id }}
          path: reference-cache.json
          retention-days: 14
