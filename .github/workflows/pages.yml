name: Build and Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build+deploy at a time; the newest push to main wins. Without this,
# concurrent merges to main race on the force-push to gh-pages and the
# losing run fails in the deploy step (see issue #380, Actions run 468).
# Mirrors the explicit concurrency groups in validate.yml / tidal-link-check.yml
# / tidal-playlist-scan.yml.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m classical_music.cli_validator
      - run: python scripts/generate_publication_site.py
      - run: gem install bundler
      - run: bundle install
      - run: bundle exec jekyll build
      - run: test -f _site/publication/index.html
      - run: python scripts/check_publication_links.py
      - uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
