name: Build and Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build+deploy at a time; the newest push to main wins. Without this,
# concurrent merges to main race on the force-push to gh-pages and the
# losing run fails in the deploy step (see issue #380, Actions run 468).
# PR runs never deploy (the deploy step is gated on push to main) and get
# their own group so they cannot cancel an in-progress main deploy — the
# same per-PR/non-PR split as validate.yml
# (classical_music.ci_policy.concurrency_group).
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pages-pr-{0}', github.event.pull_request.number)
        || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m classical_music.cli_validator
      - run: python scripts/generate_publication_site.py
      - run: gem install bundler
      - run: bundle install
      # Build only the generated collection (issue #358): the site root is
      # the canonical collection, and internal repository material (docs/,
      # reports/, data/, tests/) never enters the build, so it cannot deploy.
      - run: bundle exec jekyll build --config _config.yml --source publication --destination _site
      - run: test -f _site/index.html
      # Fail-closed leak guard: the build output must contain only the collection.
      - run: test ! -e _site/docs && test ! -e _site/report && test ! -e _site/reports && test ! -e _site/data && test ! -e _site/sources && test ! -e _site/tests && test ! -e _site/scripts && test ! -e _site/src
      - run: python scripts/check_publication_links.py
      # Site preview for review: download the "site-preview" artifact from
      # this run to evaluate the renewed site locally before merging (issue #358).
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: site-preview
          path: _site
      - uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
