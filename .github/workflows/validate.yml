name: Validate Canonical Data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: >-
          Force the full validation route regardless of file classification.
          Push and manual runs always use the full route independent of this flag.
        type: boolean
        default: false

# Only the same pull request's own superseded runs are cancelled. Different
# PRs never share a group, and push-to-main / manual runs are never
# auto-cancelled (see docs/workflows/ci-benchmark.md).
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/measure_ci.py --label classify --
          python scripts/classify_pr_changes.py
          --event-name "${{ github.event_name }}"
          --repository "${{ github.repository }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --force-full "${{ github.event.inputs.force_full }}"
          --output ci-metrics/classification.json
        # Never fails this step: an unreliable classification degrades to the
        # full route, which is always sufficient on its own.

      - name: Run validator (single pass; console and JSON)
        run: >-
          python scripts/measure_ci.py --label validator --
          python scripts/validate_data.py --json-output validation-report.json

      - name: Add validation summary
        if: always()
        run: python scripts/summarize_validation_report.py validation-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Add validation-policy summary
        if: always()
        run: python scripts/summarize_classification.py ci-metrics/classification.json >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        env:
          CI_METRICS_DIR: ci-metrics
        run: >-
          python scripts/measure_ci.py --label pytest --
          python -m pytest -p classical_music.pytest_metrics
          --durations=30 --junitxml=ci-metrics/junit.xml
          --cov-report=xml:ci-metrics/coverage.xml
          ${{ steps.classify.outputs.pytest_targets }}
        # steps.classify.outputs.pytest_targets is empty on the full route,
        # which runs pytest's configured default (testpaths = tests/).
        # Canonical and publication validation above always run in full,
        # regardless of route; only this pytest scope narrows.

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.json

      - name: Summarize test measurements
        if: always()
        run: python scripts/summarize_ci_metrics.py ci-metrics >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-metrics/
          if-no-files-found: warn
