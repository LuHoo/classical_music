name: Tidal fingerprint backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum URLs to attempt this run (default 20)"
        required: false
        default: "20"
        type: string
  # Six bounded runs per hour, offset from the hourly link-check round at
  # minute 17. GitHub only schedules workflows from the default branch.
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"

permissions:
  contents: read

concurrency:
  group: tidal-fingerprint-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Restore maintenance rotation state
        uses: actions/cache/restore@v6
        with:
          path: |
            reports/tidal-maintenance/state.json
            reports/tidal-maintenance/latest.json
            reports/tidal-maintenance/fingerprints.json
          key: tidal-maintenance-state-v1
          restore-keys: |
            tidal-maintenance-state-v1
      - name: Capture fingerprints for up to 20 unknown URLs
        env:
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
          BACKFILL_LIMIT: ${{ inputs.limit || '20' }}
        run: |
          python scripts/backfill_tidal_fingerprints.py --use-api --country NL \
            --state reports/tidal-maintenance/fingerprints.json \
            --limit "$BACKFILL_LIMIT"
      - name: Add backfill summary
        if: always()
        run: |
          if [ -f reports/tidal-maintenance/fingerprints.md ]; then
            cat reports/tidal-maintenance/fingerprints.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No backfill report produced; see the backfill step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save maintenance rotation state
        uses: actions/cache/save@v6
        with:
          path: |
            reports/tidal-maintenance/state.json
            reports/tidal-maintenance/latest.json
            reports/tidal-maintenance/fingerprints.json
          key: tidal-maintenance-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tidal-fingerprint-backfill-${{ github.run_id }}
          path: |
            reports/tidal-maintenance/fingerprints.json
            reports/tidal-maintenance/fingerprints.md
          if-no-files-found: ignore
          retention-days: 14
