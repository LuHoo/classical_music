title: "Classical Music"
description: "Favorite classical recordings by composer"
url: "https://luhoo.github.io"   # your GitHub Pages root URL
baseurl: "/classical_music"      # the repository name

# Theme - using default Jekyll theme for maximum compatibility
# (comment out just-the-docs to use default)
# remote_theme: just-the-docs/just-the-docs

# Jekyll settings
markdown: kramdown
highlighter: rouge

# Site structure
collections:
  pages:
    output: true
    permalink: /:path/

# Data directories
data_dir: _data_generated

# Build settings
include:
  - _data_generated
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - tests
  - reports
  - docs
  - data
  - side materials
  - generated
